- id: olist-014
  category: simple
  question: How many products are in the catalog?
  gold_sql: 'SELECT COUNT(*) FROM products

    '
- id: olist-015
  category: simple
  question: How many orders were canceled?
  gold_sql: 'SELECT COUNT(*) FROM orders WHERE order_status = ''canceled''

    '
- id: olist-018
  category: metric
  question: What was the average review score of delivered orders, rounded to 2 decimals?
  gold_sql: "WITH latest AS (\n  SELECT DISTINCT ON (order_id) order_id, review_score\n\
    \  FROM order_reviews ORDER BY order_id, review_creation_date DESC)\nSELECT ROUND(AVG(l.review_score)::numeric,\
    \ 2)\nFROM orders o JOIN latest l ON l.order_id = o.order_id\nWHERE o.order_status\
    \ = 'delivered'\n"
- id: olist-019
  category: multi_join
  question: Which payment type accounted for the highest total payment value on delivered
    orders?
  gold_sql: 'SELECT p.payment_type FROM order_payments p JOIN orders o ON o.order_id
    = p.order_id

    WHERE o.order_status = ''delivered''

    GROUP BY p.payment_type ORDER BY SUM(p.payment_value) DESC LIMIT 1

    '
- id: olist-020
  category: multi_join
  question: How many different people in the state of SP placed at least one delivered
    order?
  gold_sql: 'SELECT COUNT(DISTINCT c.customer_unique_id)

    FROM customers c JOIN orders o ON o.customer_id = c.customer_id

    WHERE c.customer_state = ''SP'' AND o.order_status = ''delivered''

    '
- id: olist-021
  category: multi_join
  question: Which seller had the highest total sales?
  gold_sql: 'SELECT oi.seller_id FROM order_items oi JOIN orders o ON o.order_id =
    oi.order_id

    WHERE o.order_status NOT IN (''canceled'', ''unavailable'')

    GROUP BY oi.seller_id ORDER BY SUM(oi.price) DESC LIMIT 1

    '
- id: olist-022
  category: metric
  question: What was the average number of items per order, among orders that count
    as sales, rounded to 2 decimals?
  gold_sql: "SELECT ROUND(AVG(c)::numeric, 2) FROM (\n  SELECT oi.order_id, COUNT(*)\
    \ AS c\n  FROM order_items oi JOIN orders o ON o.order_id = oi.order_id\n  WHERE\
    \ o.order_status NOT IN ('canceled', 'unavailable')\n  GROUP BY oi.order_id) t\n"
