- id: appdb-001
  category: simple
  question: How many accounts do we have?
  gold_sql: 'SELECT COUNT(*) FROM accounts WHERE is_test = false AND deleted_at IS
    NULL

    '
- id: appdb-002
  category: simple
  question: How many users do we have?
  gold_sql: 'SELECT COUNT(*) FROM users u JOIN accounts a ON a.id = u.account_id

    WHERE u.deleted_at IS NULL AND a.is_test = false AND a.deleted_at IS NULL

    '
- id: appdb-003
  category: simple
  question: How many accounts signed up in 2025?
  gold_sql: "SELECT COUNT(*) FROM accounts\nWHERE is_test = false AND deleted_at IS\
    \ NULL\n  AND created_at >= '2025-01-01 00:00:00+00' AND created_at < '2026-01-01\
    \ 00:00:00+00'\n"
- id: appdb-004
  category: simple
  question: How many subscriptions are currently active?
  gold_sql: 'SELECT COUNT(*) FROM subscriptions s JOIN accounts a ON a.id = s.account_id

    WHERE s.status = ''active'' AND a.is_test = false AND a.deleted_at IS NULL

    '
- id: appdb-005
  category: simple
  question: Which plan tier has the most active subscriptions?
  gold_sql: 'SELECT s.plan_tier FROM subscriptions s JOIN accounts a ON a.id = s.account_id

    WHERE s.status = ''active'' AND a.is_test = false AND a.deleted_at IS NULL

    GROUP BY s.plan_tier ORDER BY COUNT(*) DESC LIMIT 1

    '
