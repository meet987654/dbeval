- id: appdb-029
  category: multi_join
  question: How many accounts created in 2024 currently have an active subscription?
  gold_sql: |
    SELECT COUNT(DISTINCT a.id) FROM accounts a JOIN subscriptions s ON s.account_id = a.id
    WHERE s.status = 'active' AND a.is_test = false AND a.deleted_at IS NULL
      AND a.created_at >= '2024-01-01 00:00:00+00' AND a.created_at < '2025-01-01 00:00:00+00'

- id: appdb-030
  category: metric
  question: What percentage of accounts created in Q1 2025 had churned by 30 September 2026, rounded to 2 decimals?
  gold_sql: |
    SELECT ROUND(100.0 * COUNT(DISTINCT s.account_id) / (
      SELECT COUNT(*) FROM accounts
       WHERE is_test = false AND deleted_at IS NULL
         AND created_at >= '2025-01-01 00:00:00+00' AND created_at < '2025-04-01 00:00:00+00'), 2)
    FROM subscriptions s JOIN accounts a ON a.id = s.account_id
    WHERE s.status = 'canceled' AND s.cancel_reason IN ('voluntary', 'payment_failed')
      AND s.canceled_at < '2026-10-01 00:00:00+00'
      AND a.is_test = false AND a.deleted_at IS NULL
      AND a.created_at >= '2025-01-01 00:00:00+00' AND a.created_at < '2025-04-01 00:00:00+00'

- id: appdb-031
  category: metric
  question: How many distinct users logged in at least once in Q3 2026?
  gold_sql: |
    SELECT COUNT(DISTINCT e.user_id) FROM events e
    JOIN users u ON u.id = e.user_id JOIN accounts a ON a.id = u.account_id
    WHERE e.event_type = 'login'
      AND e.occurred_at >= '2026-07-01 00:00:00+00' AND e.occurred_at < '2026-10-01 00:00:00+00'
      AND u.deleted_at IS NULL AND a.is_test = false AND a.deleted_at IS NULL

- id: appdb-032
  category: multi_join
  question: How many accounts have no users left, meaning every user on the account has been deleted?
  gold_sql: |
    SELECT COUNT(*) FROM accounts a
    WHERE a.is_test = false AND a.deleted_at IS NULL
      AND EXISTS (SELECT 1 FROM users u WHERE u.account_id = a.id)
      AND NOT EXISTS (SELECT 1 FROM users u WHERE u.account_id = a.id AND u.deleted_at IS NULL)

- id: appdb-033
  category: multi_join
  question: How much was refunded in USD on invoices issued in Q2 2026, whenever the refund happened?
  gold_sql: |
    SELECT ROUND(SUM(r.amount_cents::numeric / 100 * f.usd_per_unit), 2)
    FROM refunds r JOIN invoices i ON i.id = r.invoice_id
    JOIN fx_rates f ON f.currency = i.currency JOIN accounts a ON a.id = i.account_id
    WHERE i.issued_at >= '2026-04-01 00:00:00+00' AND i.issued_at < '2026-07-01 00:00:00+00'
      AND a.is_test = false AND a.deleted_at IS NULL

- id: appdb-034
  category: simple
  question: How many accounts do we have in each country?
