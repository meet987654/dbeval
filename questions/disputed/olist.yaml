- id: olist-017
  category: metric
  question: How many orders contained items from more than one seller?
  gold_sql: "SELECT COUNT(*) FROM (\n  SELECT order_id FROM order_items GROUP BY order_id\
    \ HAVING COUNT(DISTINCT seller_id) > 1) t\n"
  oracles:
    oracle_a:
      agrees: true
      sql: "SELECT COUNT(*) AS orders_with_multiple_sellers\nFROM (\n    SELECT oi.order_id\n\
        \    FROM order_items oi\n    GROUP BY oi.order_id\n    HAVING COUNT(DISTINCT\
        \ oi.seller_id) > 1\n) AS sub"
      error: null
    oracle_b:
      agrees: false
      sql: 'SELECT COUNT(DISTINCT oi.order_id) AS order_count

        FROM order_items oi

        JOIN orders o ON oi.order_id = o.order_id

        WHERE o.order_status NOT IN (''canceled'', ''unavailable'')

        GROUP BY oi.order_id

        HAVING COUNT(DISTINCT oi.seller_id) > 1'
      error: null
