- id: olist-012
  category: multi_join
  question: Among categories with at least 500 items sold, which 3 have the highest
    average review score? Return only the category name.
  ordered: true
  gold_sql: "WITH latest AS (\n  SELECT DISTINCT ON (order_id) order_id, review_score\n\
    \  FROM order_reviews ORDER BY order_id, review_creation_date DESC)\nSELECT COALESCE(t.product_category_name_english,\
    \ p.product_category_name) AS category\nFROM order_items oi JOIN orders o ON o.order_id\
    \ = oi.order_id\nJOIN products p ON p.product_id = oi.product_id\nLEFT JOIN product_category_name_translation\
    \ t ON t.product_category_name = p.product_category_name\nJOIN latest l ON l.order_id\
    \ = oi.order_id\nWHERE p.product_category_name IS NOT NULL\n  AND o.order_status\
    \ NOT IN ('canceled', 'unavailable')\nGROUP BY 1 HAVING COUNT(*) >= 500\nORDER\
    \ BY AVG(l.review_score) DESC LIMIT 3\n"
  oracles:
    oracle_a:
      agrees: true
      sql: "WITH recent_reviews AS (\n    SELECT DISTINCT ON (orv.order_id)\n    \
        \       orv.order_id,\n           orv.review_score::numeric AS review_score\n\
        \    FROM order_reviews orv\n    ORDER BY orv.order_id,\n             orv.review_creation_date::timestamp\
        \ DESC\n),\nsold_items AS (\n    SELECT oi.order_id,\n           p.product_category_name,\n\
        \           1 AS item_cnt\n    FROM order_items oi\n    JOIN orders o\n  \
        \        ON oi.order_id = o.order_id\n         AND o.order_status NOT IN ('canceled',\
        \ 'unavailable')\n    JOIN products p\n          ON oi.product_id = p.product_id\n\
        )\nSELECT COALESCE(t.product_category_name_english, si.product_category_name)\
        \ AS category_name\nFROM sold_items si\nJOIN recent_reviews rr\n      ON si.order_id\
        \ = rr.order_id\nLEFT JOIN product_category_name_translation t\n       ON\
        \ si.product_category_name = t.product_category_name\nGROUP BY category_name\n\
        HAVING COUNT(si.item_cnt) >= 500\nORDER BY AVG(rr.review_score) DESC\nLIMIT\
        \ 3"
      error: null
    oracle_b:
      agrees: false
      sql: "WITH valid_orders AS (\n    SELECT order_id\n    FROM orders\n    WHERE\
        \ order_status NOT IN ('canceled', 'unavailable')\n),\nitems_sold AS (\n \
        \   SELECT\n        oi.order_id,\n        oi.product_id\n    FROM order_items\
        \ oi\n    JOIN valid_orders vo ON oi.order_id = vo.order_id\n),\ncategory_counts\
        \ AS (\n    SELECT\n        COALESCE(t.product_category_name_english, p.product_category_name)\
        \ AS category_name,\n        COUNT(*) AS items_sold\n    FROM items_sold is_\n\
        \    JOIN products p ON is_.product_id = p.product_id\n    LEFT JOIN product_category_name_translation\
        \ t ON p.product_category_name = t.product_category_name\n    WHERE p.product_category_name\
        \ IS NOT NULL\n    GROUP BY COALESCE(t.product_category_name_english, p.product_category_name)\n\
        \    HAVING COUNT(*) >= 500\n),\nlatest_reviews AS (\n    SELECT\n       \
        \ order_id,\n        review_score,\n        ROW_NUMBER() OVER (PARTITION BY\
        \ order_id ORDER BY review_creation_date DESC) AS rn\n    FROM order_reviews\n\
        ),\norder_reviews_latest AS (\n    SELECT order_id, review_score\n    FROM\
        \ latest_reviews\n    WHERE rn = 1\n),\ncategory_avg_scores AS (\n    SELECT\n\
        \        COALESCE(t.product_category_name_english, p.product_category_name)\
        \ AS category_name,\n        AVG(CAST(olr.review_score AS DOUBLE PRECISION))\
        \ AS avg_review_score\n    FROM items_sold is_\n    JOIN products p ON is_.product_id\
        \ = p.product_id\n    LEFT JOIN product_category_name_translation t ON p.product_category_name\
        \ = t.product_category_name\n    JOIN order_reviews_latest olr ON is_.order_id\
        \ = olr.order_id\n    WHERE p.product_category_name IS NOT NULL\n    GROUP\
        \ BY COALESCE(t.product_category_name_english, p.product_category_name)\n\
        )\nSELECT\n    cas.category_name\nFROM category_avg_scores cas\nJOIN category_counts\
        \ cc ON cas.category_name = cc.category_name\nORDER BY cas.avg_review_score\
        \ DESC\nLIMIT 3"
      error: null
