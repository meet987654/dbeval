tables:
  accounts:
    table: public.accounts
    description: "Real account: is_test = false AND deleted_at IS NULL. Never count test or deleted accounts in any business metric. Date windows are half-open: start inclusive, next start exclusive (>= start AND < next_start). Never use BETWEEN."
    columns:
      - name: id
        type: number
        pk: true
        nullable: false
      - name: name
        type: string
        nullable: false
      - name: plan
        type: string
        description: "Old plan name from signup. Never correct for reporting. Use plan_tier instead."
      - name: plan_tier
        type: string
        description: "Current plan tier: 'starter', 'growth', 'scale'. Always use plan_tier for reporting."
      - name: is_test
        type: boolean
        nullable: false
        description: "Test flag. Real accounts have is_test = false."
      - name: country
        type: string
      - name: currency
        type: string
      - name: created_at
        type: time
        nullable: false
      - name: deleted_at
        type: time
        description: "Soft deletion timestamp. Real accounts have deleted_at IS NULL."
    metrics:
      - name: paying_customers
        sql: "COUNT(DISTINCT CASE WHEN accounts.is_test = false AND accounts.deleted_at IS NULL AND invoices.status = 'paid' THEN accounts.id END)"
        description: "Paying customer in a period: a real account with at least one paid invoice (status = 'paid') whose paid_at is in the period."
      - name: churned_accounts
        sql: "COUNT(DISTINCT CASE WHEN accounts.is_test = false AND accounts.deleted_at IS NULL AND subscriptions.status = 'canceled' AND subscriptions.cancel_reason IN ('voluntary', 'payment_failed') THEN accounts.id END)"
        description: "Churned account: real account that has at least one churn subscription canceled on or before the date asked about."
    joins:
      - to: events
        "on": accounts.id = events.account_id
        relationship: one_to_many
        source: inferred
      - to: invoices
        "on": accounts.id = invoices.account_id
        relationship: one_to_many
        source: inferred
      - to: subscriptions
        "on": accounts.id = subscriptions.account_id
        relationship: one_to_many
        source: inferred
      - to: users
        "on": accounts.id = users.account_id
        relationship: one_to_many
        source: inferred
  events:
    table: public.events
    description: "User events. Active user in a period: a real user with at least one event in the period."
    columns:
      - name: id
        type: number
        pk: true
        nullable: false
      - name: account_id
        type: number
        nullable: false
      - name: user_id
        type: number
        nullable: false
      - name: event_type
        type: string
        nullable: false
      - name: occurred_at
        type: time
        nullable: false
    joins:
      - to: accounts
        "on": events.account_id = accounts.id
        relationship: many_to_one
        source: inferred
      - to: users
        "on": events.user_id = users.id
        relationship: many_to_one
        source: inferred
  fx_rates:
    table: public.fx_rates
    description: "Exchange rates to USD. Currencies: USD (1.00000), EUR (1.08000), INR (0.01200). USD value = amount_cents::numeric / 100 * fx_rates.usd_per_unit using invoice currency."
    columns:
      - name: currency
        type: string
        pk: true
        nullable: false
      - name: usd_per_unit
        type: number
        nullable: false
  invoices:
    table: public.invoices
    description: "Invoices table. Money stored in cents. USD value = amount_cents::numeric / 100 * fx_rates.usd_per_unit. Gross revenue for a period: paid invoices (status = 'paid') with paid_at in period, real accounts only, in USD. Net revenue = gross revenue minus refunds as separate sums on separate date columns (paid_at for invoices, created_at for refunds)."
    columns:
      - name: id
        type: number
        pk: true
        nullable: false
      - name: subscription_id
        type: number
        nullable: false
      - name: account_id
        type: number
        nullable: false
      - name: amount_cents
        type: number
        nullable: false
        description: "Amount stored in cents. USD value = amount_cents::numeric / 100 * fx_rates.usd_per_unit. Divide as numeric to avoid integer truncation."
      - name: currency
        type: string
        nullable: false
        description: "Invoice currency: 'USD', 'EUR', 'INR'."
      - name: status
        type: string
        nullable: false
        description: "Invoice status: 'paid', 'void', 'failed', 'open'. Gross revenue only counts 'paid'."
      - name: issued_at
        type: time
        nullable: false
      - name: paid_at
        type: time
        description: "Timestamp when paid. Gross revenue filters on paid_at in period."
    metrics:
      - name: gross_revenue_usd
        sql: "SUM(CASE WHEN invoices.status = 'paid' AND accounts.is_test = false AND accounts.deleted_at IS NULL THEN invoices.amount_cents::numeric / 100 * fx_rates.usd_per_unit ELSE 0 END)"
        description: "Gross revenue for a period: paid invoices (status = 'paid') with paid_at in the period, real accounts only, in USD."
    joins:
      - to: accounts
        "on": invoices.account_id = accounts.id
        relationship: many_to_one
        source: inferred
      - to: subscriptions
        "on": invoices.subscription_id = subscriptions.id
        relationship: many_to_one
        source: inferred
      - to: refunds
        "on": invoices.id = refunds.invoice_id
        relationship: one_to_many
        source: inferred
  subscriptions:
    table: public.subscriptions
    description: "Subscriptions table. Active subscription: status = 'active' on a real account (is_test = false AND deleted_at IS NULL). trialing and past_due are not active. Churn: status = 'canceled' AND cancel_reason IN ('voluntary', 'payment_failed') with canceled_at in period on a real account; cancel_reason = 'upgrade' is NOT churn."
    columns:
      - name: id
        type: number
        pk: true
        nullable: false
      - name: account_id
        type: number
        nullable: false
      - name: plan_tier
        type: string
        nullable: false
        description: "Plan tier ('starter', 'growth', 'scale')."
      - name: status
        type: string
        nullable: false
        description: "Status: 'active', 'past_due', 'trialing', 'canceled'. Only 'active' is active."
      - name: started_at
        type: time
        nullable: false
      - name: trial_ends_at
        type: time
      - name: canceled_at
        type: time
        description: "Timestamp when canceled. Churn filters on canceled_at in period."
      - name: cancel_reason
        type: string
        description: "Cancellation reason: 'voluntary', 'payment_failed', 'upgrade'. 'upgrade' is NOT churn."
    metrics:
      - name: active_subscriptions
        sql: "COUNT(CASE WHEN subscriptions.status = 'active' AND accounts.is_test = false AND accounts.deleted_at IS NULL THEN subscriptions.id END)"
        description: "Active subscriptions on real accounts."
      - name: churned_subscriptions
        sql: "COUNT(CASE WHEN subscriptions.status = 'canceled' AND subscriptions.cancel_reason IN ('voluntary', 'payment_failed') AND accounts.is_test = false AND accounts.deleted_at IS NULL THEN subscriptions.id END)"
        description: "Churn subscriptions count in period on real accounts."
    joins:
      - to: invoices
        "on": subscriptions.id = invoices.subscription_id
        relationship: one_to_many
        source: inferred
      - to: accounts
        "on": subscriptions.account_id = accounts.id
        relationship: many_to_one
        source: inferred
  refunds:
    table: public.refunds
    description: "Refunds for a period: refunds with created_at in period, real accounts only, in USD. A refund belongs to an invoice through refunds.invoice_id (no FK) and uses the currency of that invoice. Net revenue = gross revenue minus refunds for the same period (cash basis) computed as two separate sums with separate date filters (paid_at for invoices, created_at for refunds)."
    columns:
      - name: id
        type: number
        pk: true
        nullable: false
      - name: invoice_id
        type: number
        nullable: false
        description: "Links refund to invoice via invoices.id. Currency is inherited from invoice."
      - name: amount_cents
        type: number
        nullable: false
        description: "Refund amount in cents. USD value = amount_cents::numeric / 100 * fx_rates.usd_per_unit using invoice currency."
      - name: created_at
        type: time
        nullable: false
        description: "Timestamp when refund was created. Refunds count in the period created_at falls in."
    metrics:
      - name: refunds_usd
        sql: "SUM(CASE WHEN accounts.is_test = false AND accounts.deleted_at IS NULL THEN refunds.amount_cents::numeric / 100 * fx_rates.usd_per_unit ELSE 0 END)"
        description: "Refunds for a period: created_at in period, real accounts only, in USD."
    joins:
      - to: invoices
        "on": refunds.invoice_id = invoices.id
        relationship: many_to_one
        source: inferred
  users:
    table: public.users
    description: "Users table. Real user: users.deleted_at IS NULL and belongs to a real account (accounts.is_test = false AND accounts.deleted_at IS NULL). Active user in a period: a real user with at least one event in the period."
    columns:
      - name: id
        type: number
        pk: true
        nullable: false
      - name: account_id
        type: number
        nullable: false
      - name: email
        type: string
      - name: role
        type: string
      - name: created_at
        type: time
        nullable: false
      - name: deleted_at
        type: time
        description: "Soft deletion timestamp. Real users have deleted_at IS NULL."
    metrics:
      - name: active_users
        sql: "COUNT(DISTINCT CASE WHEN users.deleted_at IS NULL AND accounts.is_test = false AND accounts.deleted_at IS NULL AND events.id IS NOT NULL THEN users.id END)"
        description: "Active user in a period: real user with at least one event in the period."
    joins:
      - to: events
        "on": users.id = events.user_id
        relationship: one_to_many
        source: inferred
      - to: accounts
        "on": users.account_id = accounts.id
        relationship: many_to_one
        source: inferred
