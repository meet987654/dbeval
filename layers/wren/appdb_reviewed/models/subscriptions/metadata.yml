name: subscriptions
table_reference:
  catalog: ''
  schema: public
  table: subscriptions
columns:
- name: id
  type: INTEGER
  is_calculated: false
  not_null: true
  is_primary_key: true
  properties: {}
- name: account_id
  type: INTEGER
  is_calculated: false
  not_null: true
  is_primary_key: false
  properties: {}
- name: plan_tier
  type: VARCHAR
  is_calculated: false
  not_null: true
  is_primary_key: false
  description: "Plan tier: 'starter', 'growth', 'scale'."
  properties: {}
- name: status
  type: VARCHAR
  is_calculated: false
  not_null: true
  is_primary_key: false
  description: "Subscription status: 'active', 'past_due', 'trialing', 'canceled'. Only 'active' is active."
  properties: {}
- name: started_at
  type: TIMESTAMPTZ
  is_calculated: false
  not_null: true
  is_primary_key: false
  properties: {}
- name: trial_ends_at
  type: TIMESTAMPTZ
  is_calculated: false
  not_null: false
  is_primary_key: false
  properties: {}
- name: canceled_at
  type: TIMESTAMPTZ
  is_calculated: false
  not_null: false
  is_primary_key: false
  description: "Timestamp when canceled. Churn filters on canceled_at in period."
  properties: {}
- name: cancel_reason
  type: VARCHAR
  is_calculated: false
  not_null: false
  is_primary_key: false
  description: "Cancellation reason: 'voluntary', 'payment_failed', 'upgrade'. 'upgrade' is NOT churn."
  properties: {}
- name: is_active_sub
  type: BOOLEAN
  is_calculated: true
  not_null: false
  is_primary_key: false
  expression: "status = 'active'"
  description: "True if status = 'active'. trialing and past_due are not active."
  properties: {}
- name: is_churn
  type: BOOLEAN
  is_calculated: true
  not_null: false
  is_primary_key: false
  expression: "status = 'canceled' AND cancel_reason IN ('voluntary', 'payment_failed')"
  description: "True if status = 'canceled' and cancel_reason IN ('voluntary', 'payment_failed'). upgrade is NOT churn."
  properties: {}
primary_key: id
cached: false
properties:
  description: "Subscriptions table. Active subscription: status = 'active' on a real account (accounts.is_test = false AND accounts.deleted_at IS NULL). trialing and past_due are not active. Churn: status = 'canceled' AND cancel_reason IN ('voluntary', 'payment_failed') with canceled_at in period on a real account; cancel_reason = 'upgrade' is NOT churn."
