name: invoices
table_reference:
  catalog: ''
  schema: public
  table: invoices
columns:
- name: id
  type: INTEGER
  is_calculated: false
  not_null: true
  is_primary_key: true
  properties: {}
- name: subscription_id
  type: INTEGER
  is_calculated: false
  not_null: true
  is_primary_key: false
  properties: {}
- name: account_id
  type: INTEGER
  is_calculated: false
  not_null: true
  is_primary_key: false
  properties: {}
- name: amount_cents
  type: INTEGER
  is_calculated: false
  not_null: true
  is_primary_key: false
  description: "Amount stored in cents. USD value = amount_cents::numeric / 100 * fx_rates.usd_per_unit. Divide as numeric to prevent truncation."
  properties: {}
- name: currency
  type: VARCHAR
  is_calculated: false
  not_null: true
  is_primary_key: false
  description: "Invoice currency: 'USD', 'EUR', 'INR'."
  properties: {}
- name: status
  type: VARCHAR
  is_calculated: false
  not_null: true
  is_primary_key: false
  description: "Invoice status: 'paid', 'void', 'failed', 'open'. Gross revenue only counts 'paid'."
  properties: {}
- name: issued_at
  type: TIMESTAMPTZ
  is_calculated: false
  not_null: true
  is_primary_key: false
  properties: {}
- name: paid_at
  type: TIMESTAMPTZ
  is_calculated: false
  not_null: false
  is_primary_key: false
  description: "Timestamp when paid. Gross revenue filters on paid_at in period."
  properties: {}
- name: amount_usd
  type: DOUBLE
  is_calculated: true
  not_null: false
  is_primary_key: false
  expression: "amount_cents::numeric / 100"
  description: "Invoice amount in base units (cents / 100 as numeric). Multiply by fx_rates.usd_per_unit for USD."
  properties: {}
primary_key: id
cached: false
properties:
  description: "Invoices table. Money stored in cents. USD value = amount_cents::numeric / 100 * fx_rates.usd_per_unit. Gross revenue for a period: paid invoices (status = 'paid') with paid_at in period, real accounts only, in USD. Net revenue = gross revenue minus refunds as separate sums on separate date columns (paid_at for invoices, created_at for refunds)."
