name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: |
          pip install pyyaml sqlalchemy openai sqlglot duckdb duckdb-engine pytz

      - name: Run scorer, runner, and ruleminer unit tests
        run: |
          python scorer/test_compare.py
          python scorer/test_validate_questions.py
          python scorer/test_analyze.py
          python runners/test_baseline.py
          python -m unittest ruleminer.test_ruleminer

      - name: Validate question suites
        run: |
          python scorer/validate_questions.py

      - name: Run Option 0 headline analysis
        run: |
          python scorer/analyze.py results/raw/suite_results_all.csv --ties half

      - name: Byte-compile all Python files
        run: |
          find . -name "*.py" -not -path "*/.*" -exec python -m py_compile {} +
